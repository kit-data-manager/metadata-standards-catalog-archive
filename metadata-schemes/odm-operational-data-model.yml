description: 'ODM-XML is a data exchange standard, vendor-neutral, platform-independent
  suited for exchanging and archiving clinical and translational research data, along
  with their associated metadata, administrative data, reference data, and audit information.
  ODM-XML facilitates the regulatory-compliant acquisition, archival and exchange
  of metadata and data. '
