description: "FHIR is a set of standards for the exchange of healthcare information\
  \ and data. It defines metadata schemas for describing various entities relevant\
  \ to healthcare – such as patients, procedures, and clinical reasoning – as well\
  \ as protocols for exchanging data and metadata records between systems. The information\
  \ may be serialized as XML, JSON, ND-JSON, or RDF/Turtle.\r\n\r\nThe Infrastructure\
  \ Package was approved as standard ANSI/HL7 FHIR® R4 INFRASTRUCTURE R1-2019."
