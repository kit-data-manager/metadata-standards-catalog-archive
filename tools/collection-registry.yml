description: 'This project provides an implementation of the Collection Registry as
  it was proposed by the RDA Recommendation on Research Data Collections doi: 10.15497/RDA00022.
  The Collection Registry is implemented as Spring Boot-based Microservice and can
  be used for building collections of digital objects in a generic way independent
  from any repository managing the digital objects. The implementation is complete
  with regard to the recommendations supporting pagination, collection sorting, and
  listing of sub-collections.'
