description: Helmholtz Zentrum München is the German Research Center for Environmental
  Health. It investigates important common diseases which develop from the interaction
  of lifestyle, environmental factors and personal genetic background, focusing particularly
  on diabetes mellitus, allergies and chronic lung diseases. Helmholtz Zentrum München
  is a research institution of the Federal Republic of Germany and the Free State
  of Bavaria. It is a member of the Helmholtz Association of German Research Centers.
