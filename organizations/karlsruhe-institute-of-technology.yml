description: The Karlsruhe Institute of Technology (KIT) is “The Research University
  in the Helmholtz Association.” As the only German university of excellence with
  a national large-scale research sector, we offer our students, researchers, and
  employees unique learning, teaching, and working conditions. The roots of the academic
  education institution extend all the way back to 1825. Today’s structure of KIT
  is the result of the merger of the Technical University of Karlsruhe and Karlsruhe
  Research Center in 2009.
